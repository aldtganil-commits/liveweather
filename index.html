<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skyline — Chanakya University Weather</title>
<meta name="description" content="Live weather for Chanakya University Global Campus, Devanahalli, Bengaluru, with animated skies that change with temperature and conditions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#4f7fd6;--bg2:#8fb2ec;--bg3:#c9dbf7;--ink:#fff;--soft:rgba(255,255,255,.72);
  --glass:rgba(255,255,255,.14);--line:rgba(255,255,255,.28);--accent:#ffd36b;
  --s:min(1vw,1.8vh);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:Sora,system-ui,sans-serif;color:var(--ink);background:#0b1020;
  -webkit-font-smoothing:antialiased}
#sky{position:fixed;inset:0;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  transition:background 2s ease}
#sky::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.35),transparent 60%)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
.blob{position:fixed;border-radius:50%;filter:blur(calc(var(--s)*6));opacity:.35;animation:drift 40s linear infinite;pointer-events:none}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

.app{position:relative;z-index:2;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;
  padding:calc(var(--s)*2.4) calc(var(--s)*3.6);gap:calc(var(--s)*1.5)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.6em;font-weight:600;font-size:calc(var(--s)*1.35);letter-spacing:.04em}
.brand i{width:1.8em;height:1.8em;border-radius:30%;background:conic-gradient(from 200deg,#fff,rgba(255,255,255,.2),#fff);
  -webkit-mask:radial-gradient(circle at 60% 50%,transparent 32%,#000 34%);animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:999px;padding:.55em 1.1em;font-size:calc(var(--s)*1.05);display:flex;align-items:center;gap:.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.pill .dot{width:.55em;height:.55em;border-radius:50%;background:#5dffa0;box-shadow:0 0 0 0 #5dffa0;animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 .6em transparent}}
.clock{display:flex;align-items:baseline;gap:.4em;font-weight:200;font-size:calc(var(--s)*2.2)}
.clock small{font-size:.38em;opacity:.7;line-height:1.1;font-weight:400}

main{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:center;min-height:0}
.left .tag{font-family:"JetBrains Mono";font-size:calc(var(--s)*.95);letter-spacing:.3em;opacity:.75;text-transform:uppercase}
.left h1{font-weight:300;font-size:calc(var(--s)*7);line-height:.95;letter-spacing:-.04em;margin:.15em 0 .05em;
  background:linear-gradient(180deg,#fff 40%,rgba(255,255,255,.45));-webkit-background-clip:text;background-clip:text;color:transparent}
.left h2{font-weight:300;font-size:calc(var(--s)*3);opacity:.9}
.left p{max-width:32em;font-size:calc(var(--s)*1.1);line-height:1.6;color:var(--soft);margin-top:1em}
.mini{display:flex;gap:calc(var(--s)*3);margin-top:calc(var(--s)*2.5)}
.mini div{min-width:5em}
.mini b{display:block;font-weight:200;font-size:calc(var(--s)*3)}
.mini span{font-size:calc(var(--s)*.85);letter-spacing:.12em;opacity:.7;text-transform:uppercase}
.mini div::after{content:"";display:block;height:2px;margin-top:.6em;border-radius:2px;background:linear-gradient(90deg,var(--accent),transparent)}

.center{position:relative;height:100%;display:grid;place-items:center;min-height:0}
#icon{width:calc(var(--s)*30);height:calc(var(--s)*30);position:relative;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(calc(var(--s)*-1.6))}}
.sun{position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c9,#ffd36b 45%,#ff9a3c);
  box-shadow:0 0 calc(var(--s)*6) #ffcb5c,0 0 calc(var(--s)*14) rgba(255,180,60,.6)}
.rays{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,230,150,.5) 0 4deg,transparent 4deg 22deg);
  -webkit-mask:radial-gradient(circle,transparent 38%,#000 40%,transparent 70%);animation:spin 30s linear infinite}
.moon{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#d9def0 60%,#aab3d4);
  box-shadow:0 0 calc(var(--s)*8) rgba(200,215,255,.6)}
.moon::before{content:"";position:absolute;width:18%;height:18%;top:30%;left:52%;border-radius:50%;background:rgba(150,160,200,.35);box-shadow:-2.5em 2em 0 -.3em rgba(150,160,200,.3)}
.cloud{position:absolute;left:5%;right:5%;top:30%;height:45%}
.cloud i{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff,#e8eefb 60%,#c3cfe8);box-shadow:inset 0 -1em 2em rgba(120,140,190,.35)}
.cloud.dark i{background:radial-gradient(circle at 40% 30%,#c9cfdf,#8d97b3 60%,#5e6889)}
.cloud i:nth-child(1){width:42%;height:62%;left:8%;bottom:0}
.cloud i:nth-child(2){width:52%;height:92%;left:28%;bottom:8%}
.cloud i:nth-child(3){width:38%;height:58%;right:6%;bottom:0}
.cloud i:nth-child(4){left:10%;right:8%;height:42%;bottom:0;border-radius:999px}
.bolt{position:absolute;left:44%;top:62%;width:16%;height:34%;background:linear-gradient(#fff6a8,#ffc83d);
  clip-path:polygon(40% 0,100% 0,62% 42%,95% 42%,20% 100%,42% 55%,8% 55%);filter:drop-shadow(0 0 .8em #ffd84d);animation:zap 3.5s infinite}
@keyframes zap{0%,88%,100%{opacity:0}90%,94%{opacity:1}92%{opacity:.2}}
.loc-line{position:absolute;bottom:4%;font-family:"JetBrains Mono";font-size:calc(var(--s)*.9);letter-spacing:.3em;opacity:.75;text-transform:uppercase;text-align:center}

.right{justify-self:end;text-align:right;width:min(100%,calc(var(--s)*32))}
.temp{padding-right:.35em;font-weight:200;font-size:calc(var(--s)*12);line-height:.85;letter-spacing:-.06em;position:relative;display:inline-block}
.temp sup{font-size:.3em;position:absolute;top:.15em;right:-.1em;font-weight:300}
.feels{font-size:calc(var(--s)*1.1);opacity:.8;margin:.6em 0 1.4em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 calc(var(--s)*2);text-align:left}
.grid div{border-top:1px solid var(--line);padding:calc(var(--s)*.8) 0}
.grid span{font-family:"JetBrains Mono";font-size:calc(var(--s)*.8);letter-spacing:.14em;opacity:.7;text-transform:uppercase}
.grid b{display:block;font-weight:400;font-size:calc(var(--s)*1.5);margin-top:.15em}

footer{position:relative;height:calc(var(--s)*13);min-height:90px}
footer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hours{position:absolute;inset:0;display:flex}
.h{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:calc(var(--s)*.95);gap:.25em;padding-bottom:.2em}
.h .t{opacity:.7;font-family:"JetBrains Mono";font-size:.85em}
.h .e{font-size:1.5em}
.h b{font-weight:400}
.path{stroke-dasharray:4000;stroke-dashoffset:4000;animation:draw 3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

#loader{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#0d1530;transition:opacity 1s}
#loader div{text-align:center;font-weight:300;letter-spacing:.2em;font-size:14px}
#loader .ring{width:60px;height:60px;margin:0 auto 18px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:#fff;animation:spin 1s linear infinite}
.fade{animation:fin 1.2s ease both}@keyframes fin{from{opacity:0;transform:translateY(12px)}}

/* Portrait / phones */
@media (max-aspect-ratio:1/1){
  :root{--s:min(1.9vw,1.15vh)}
  .app{padding:calc(var(--s)*3) calc(var(--s)*3.5)}
  main{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;gap:calc(var(--s)*1)}
  .left{grid-column:1/2;grid-row:1}
  .right{grid-column:2/3;grid-row:1;align-self:start}
  .center{grid-column:1/3;grid-row:2}
  .stats{grid-column:1/3;grid-row:3}
  .left h1{font-size:calc(var(--s)*6.5)}
  .left p,.feels{display:none}
  .temp{font-size:calc(var(--s)*11)}
  .mini{gap:calc(var(--s)*2)}.mini div{min-width:0;flex:1}.clock{font-size:calc(var(--s)*2.6)}header{display:grid;grid-template-columns:auto minmax(0,1fr) auto}header .pill{justify-self:center}.brand{font-size:0}.brand i{font-size:calc(var(--s)*1.6)}
  .right .grid{display:none}
  .stats .grid{display:grid;grid-template-columns:repeat(4,1fr)}
  .clock small{display:none}
  .navcenter{display:none}
  .pill{max-width:46vw}
  .h:nth-child(n+7){display:none}
}
@media (min-aspect-ratio:1/1){.stats{display:none}}

/* Condition-driven scenery, kept behind live measurements. */
:root{--sun-core:oklch(.97 .09 95);--sun-edge:oklch(.8 .19 65);--sun-glow:oklch(.85 .16 80 / .6);--snow-ink:oklch(.98 .015 230);--scene-ink:oklch(.99 0 0 / .72);--scene-shadow:oklch(.15 .04 250 / .25)}
*{letter-spacing:0!important}
#atmosphere{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.sun{background:radial-gradient(circle at 35% 30%,var(--sun-core),var(--sun-edge));box-shadow:0 0 65px var(--sun-glow),0 0 140px var(--sun-glow);animation:sun-breathe 5s ease-in-out infinite}
.sun::after{content:"";position:absolute;inset:-18%;border:1px solid var(--scene-ink);border-radius:50%;opacity:.2;animation:solar-ring 5s ease-out infinite}
body[data-heat="hot"]{--sun-core:oklch(.98 .12 100);--sun-edge:oklch(.76 .2 53);--sun-glow:oklch(.82 .18 65 / .7)}
body[data-heat="extreme"]{--sun-core:oklch(.97 .16 100);--sun-edge:oklch(.68 .23 35);--sun-glow:oklch(.75 .22 45 / .75)}
body[data-heat="extreme"] .sun{animation-duration:2.8s}
body[data-heat="hot"] #atmosphere,body[data-heat="extreme"] #atmosphere{background:repeating-linear-gradient(0deg,transparent 0 65px,var(--sun-glow) 68px,transparent 71px);opacity:.13;animation:heat-rise 7s linear infinite;mask-image:linear-gradient(transparent 45%,var(--scene-ink))}
.cloud{animation:cloud-sway 8s ease-in-out infinite}
.cloud i{filter:drop-shadow(0 8px 18px var(--scene-shadow))}
.weather-mark{position:absolute;left:20%;right:20%;top:66%;height:32%;color:var(--snow-ink)}
.weather-mark svg{width:100%;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:3}
.rain-mark svg path{animation:drop-fall 1s linear infinite}
.rain-mark svg path:nth-child(2){animation-delay:-.35s}.rain-mark svg path:nth-child(3){animation-delay:-.7s}
.snow-mark{top:62%;font-size:56px;display:flex;justify-content:space-around;align-items:center}
.snow-mark span{animation:flake-fall 3.5s ease-in-out infinite}.snow-mark span:nth-child(2){animation-delay:-1.8s;font-size:36px}
.wind-mark{left:0;right:0;top:38%;height:48%}.wind-mark svg{stroke-width:2.5}.wind-mark path{animation:wind-flow 2s ease-in-out infinite}.wind-mark path:nth-child(2){animation-delay:-.8s}
.fog-mark{top:59%;left:8%;right:8%}.fog-mark path{animation:fog-flow 6s ease-in-out infinite}
#title{font-size:calc(var(--s)*5.8);overflow-wrap:anywhere;line-height:1.08}
.loc-line{max-width:100%;overflow-wrap:anywhere}.grid b{white-space:nowrap}
@keyframes sun-breathe{50%{transform:scale(1.05)}}
@keyframes solar-ring{to{transform:scale(1.45);opacity:0}}
@keyframes heat-rise{to{background-position:0 -142px}}
@keyframes cloud-sway{50%{translate:8px -5px}}
@keyframes drop-fall{0%{translate:0 -8px;opacity:0}35%{opacity:1}100%{translate:-5px 15px;opacity:0}}
@keyframes flake-fall{0%,100%{translate:-5px -3px;rotate:-8deg}50%{translate:6px 12px;rotate:12deg}}
@keyframes wind-flow{0%,100%{translate:-12px 0;opacity:.4}50%{translate:12px 0;opacity:1}}
@keyframes fog-flow{50%{translate:14px 0;opacity:.4}}
@media(max-aspect-ratio:1/1){#title{font-size:calc(var(--s)*5.8)}.snow-mark{font-size:42px}.stats .grid div:nth-child(n+5){display:none}.grid span{font-size:calc(var(--s)*1.1)}.grid b{font-size:calc(var(--s)*1.7)}#icon{width:min(65vw,38dvh);height:min(65vw,38dvh)}.loc-line{bottom:0}.left h2{font-size:calc(var(--s)*2.5)}.pill{font-size:calc(var(--s)*1.35)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div id="sky"></div>
<div id="atmosphere"></div>
<canvas id="fx"></canvas>
<div id="flash"></div>

<div id="loader"><div><div class="ring"></div><span id="ltxt">READING THE SKY…</span></div></div>

<div class="app">
  <header>
    <div class="brand"><i></i>SKYLINE</div>
    <div class="pill navcenter"><span class="dot"></span><span id="coords">—</span></div>
    <div class="pill"><span>📍</span><span id="place">Chanakya University</span></div>
    <div class="clock"><span id="time">--:--</span><small id="date">—</small></div>
  </header>

  <main>
    <section class="left fade">
      <div class="tag">Live weather · <span id="updated">now</span></div>
      <h1 id="title">—</h1>
      <h2 id="subtitle">—</h2>
      <p id="desc"></p>
      <div class="mini">
        <div><b id="hi">--°</b><span>High</span></div>
        <div><b id="lo">--°</b><span>Low</span></div>
        <div><b id="rainc">--%</b><span>Rain</span></div>
      </div>
    </section>

    <section class="center">
      <div id="icon"></div>
      <div class="loc-line" id="locline"></div>
    </section>

    <section class="right fade">
      <div class="temp"><span id="temp">--</span><sup>°C</sup></div>
      <div class="feels" id="feels">Feels like --°</div>
      <div class="grid" id="statsR"></div>
    </section>
    <section class="stats"><div class="grid" id="statsB"></div></section>
  </main>

  <footer>
    <svg id="wave" preserveAspectRatio="none"></svg>
    <div class="hours" id="hours"></div>
  </footer>
</div>

<script>
const $=id=>document.getElementById(id);
const tfetch=(u,ms=10000)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t))};

/* ---------- fixed location: Chanakya University Global Campus ---------- */
const LOCATION={
  lat:13.4065, lon:77.7170,
  name:'Chanakya University',
  full:'Chanakya University Global Campus, Devanahalli, Bengaluru 562165'
};
const WMO={0:["Clear","Clear skies","clear"],1:["Sunny","Mostly clear","clear"],2:["Partly Cloudy","Sun & clouds","partly"],3:["Overcast","Cloudy skies","cloudy"],
45:["Foggy","Low visibility","fog"],48:["Foggy","Freezing fog","fog"],51:["Drizzle","Light drizzle","rain"],53:["Drizzle","Steady drizzle","rain"],55:["Drizzle","Dense drizzle","rain"],
56:["Icy Drizzle","Freezing drizzle","snow"],57:["Icy Drizzle","Freezing drizzle","snow"],61:["Rainy","Light rain","rain"],63:["Rainy","Moderate rain","rain"],65:["Rainy","with Heavy Rain","rain"],
66:["Sleet","Freezing rain","snow"],67:["Sleet","Heavy freezing rain","snow"],71:["Snowy","Light snowfall","snow"],73:["Snowy","Moderate snow","snow"],75:["Snowy","Heavy snowfall","snow"],77:["Snowy","Snow grains","snow"],
80:["Showers","Passing showers","rain"],81:["Showers","Heavy showers","rain"],82:["Stormy","Violent showers","storm"],85:["Snowy","Snow showers","snow"],86:["Snowy","Heavy snow showers","snow"],
95:["Stormy","with Thunder","storm"],96:["Stormy","Thunder & hail","storm"],99:["Stormy","Severe hailstorm","storm"]};
const EMO={clear:"☀️",partly:"⛅",cloudy:"☁️",fog:"🌫️",rain:"🌧️",storm:"⛈️",snow:"❄️",wind:"💨",night:"🌙"};
const THEMES={
 clear:["#2f7fe0","#6db3ff","#ffd9a0","#ffd36b"], partly:["#4a83d4","#89b4ec","#d6e4f7","#ffd36b"],
 cloudy:["#3e4c7a","#6b7aa6","#a7b2cf","#c9d3ff"], fog:["#6f7787","#a3aab6","#d4d7dc","#ffffff"],
 rain:["#253a63","#41618f","#7d95b8","#7fd3ff"], storm:["#0f1328","#2a2f55","#4d4f78","#ffe066"],
 snow:["#7c93b8","#b9cbe4","#eef3fb","#bfe6ff"], wind:["#3b6f8f","#79a7bd","#cfe2e8","#a0ffe0"],
 night:["#05081a","#14183a","#2e2f62","#c9d3ff"]};

const HEAT_THEMES={hot:["oklch(.62 .15 42)","oklch(.73 .14 65)","oklch(.85 .12 90)","oklch(.94 .12 95)"],extreme:["oklch(.48 .18 30)","oklch(.64 .19 45)","oklch(.78 .16 70)","oklch(.96 .15 100)"],cold:["oklch(.46 .07 230)","oklch(.64 .07 220)","oklch(.83 .04 210)","oklch(.95 .03 220)"]};
function selectScene(c){
 let [title,sub,kind]=WMO[c.weather_code]||["Weather","Live conditions","cloudy"];
 const night=!c.is_day;
 if(c.wind_speed_10m>=30&&['clear','partly','cloudy'].includes(kind)){kind='wind';title='Windy';sub='Strong winds';}
 let theme=night&&['clear','partly'].includes(kind)?'night':kind;
 let heat=c.temperature_2m>=38?'extreme':c.temperature_2m>=30?'hot':c.temperature_2m<=5?'cold':'mild';
 if(night&&kind==='clear'){title='Clear Night';sub='Starry skies';}
 if(!night&&['clear','partly'].includes(kind)&&['hot','extreme'].includes(heat)){theme=heat;title=heat==='extreme'?'Very Hot':'Hot & Sunny';sub=kind==='partly'?'Heat with passing clouds':'Bright sunshine';}
 if(heat==='cold'&&['clear','partly','cloudy','wind'].includes(kind)&&!night)theme='cold';
 return {title,sub,kind,theme,heat,night};
}
/* ---------- clock ---------- */
let tz;
function tick(){const d=new Date(),o=tz?{timeZone:tz}:{};const sec=innerWidth>700;
 $('time').textContent=d.toLocaleTimeString([], {...o,hour:'2-digit',minute:'2-digit',...(sec?{second:'2-digit'}:{})});
 $('date').innerHTML=d.toLocaleDateString([], {...o,weekday:'short'})+'<br>'+d.toLocaleDateString([], {...o,day:'2-digit',month:'short',year:'numeric'});}
setInterval(tick,1000);tick();

/* ---------- weather ---------- */
async function load(){
 const url=`https://api.open-meteo.com/v1/forecast?latitude=${LOCATION.lat}&longitude=${LOCATION.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max,precipitation_sum&timezone=auto&forecast_days=2`;
 let w,err;for(let k=0;k<3&&!w;k++){try{const r=await tfetch(url);if(!r.ok)throw new Error('Weather service error '+r.status);w=await r.json()}catch(e){err=e;await new Promise(r=>setTimeout(r,1200))}}
 if(!w)throw new Error('Weather service unreachable ('+(err&&err.message)+')');
 tz=w.timezone;render(w);
 const loader=$('loader');if(loader){loader.style.opacity=0;setTimeout(()=>loader.remove(),1000);}
}
const dirName=d=>["N","NE","E","SE","S","SW","W","NW"][Math.round(d/45)%8];
const fmtT=s=>new Date(s).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
function render(w){
 const c=w.current,d=w.daily;
 const {title,sub,kind,theme,heat,night}=selectScene(c);
 const t=HEAT_THEMES[theme]||THEMES[theme];
 document.body.dataset.weather=kind;document.body.dataset.heat=heat;
 document.documentElement.style.setProperty('--bg1',t[0]);document.documentElement.style.setProperty('--bg2',t[1]);
 document.documentElement.style.setProperty('--bg3',t[2]);document.documentElement.style.setProperty('--accent',t[3]);
 $('place').textContent=LOCATION.name;$('coords').textContent=`${LOCATION.lat.toFixed(3)}°, ${LOCATION.lon.toFixed(3)}°`;
 $('title').textContent=title;$('subtitle').textContent=sub;
 $('temp').textContent=Math.round(c.temperature_2m);$('feels').textContent=`Feels like ${Math.round(c.apparent_temperature)}°C`;
 $('hi').textContent=Math.round(d.temperature_2m_max[0])+'°';$('lo').textContent=Math.round(d.temperature_2m_min[0])+'°';
 $('rainc').textContent=(d.precipitation_probability_max[0]??0)+'%';
 $('desc').textContent=`${sub}. Cloud cover ${c.cloud_cover}%, wind ${dirName(c.wind_direction_10m)} at ${Math.round(c.wind_speed_10m)} km/h with gusts up to ${Math.round(c.wind_gusts_10m)} km/h. Visibility ${(c.visibility/1000).toFixed(1)} km.`;
 $('locline').textContent=`${LOCATION.full} · ${dirName(c.wind_direction_10m)} wind`;
 $('updated').textContent='updated '+new Date().toLocaleTimeString([], {timeZone:tz,hour:'2-digit',minute:'2-digit'});
 const stats=[["Humidity",c.relative_humidity_2m+"%"],["Wind",Math.round(c.wind_speed_10m)+" km/h"],["UV index",(d.uv_index_max[0]??0).toFixed(1)],["Pressure",Math.round(c.pressure_msl)+" hPa"],
  ["Clouds",c.cloud_cover+"%"],["Rain today",d.precipitation_sum[0]+" mm"],["Sunrise",fmtT(d.sunrise[0])],["Sunset",fmtT(d.sunset[0])]];
 const html=stats.map(s=>`<div><span>${s[0]}</span><b>${s[1]}</b></div>`).join('');
 $('statsR').innerHTML=html;$('statsB').innerHTML=html;
 drawIcon(kind,night);hourly(w);startFX(kind,night,c.wind_speed_10m,heat);
 document.title=`${Math.round(c.temperature_2m)}° ${title} — ${LOCATION.name}`;
}
function drawIcon(k,night){
 const marks={rain:'<div class="weather-mark rain-mark"><svg viewBox="0 0 120 70"><path d="M30 8l-8 25"/><path d="M62 8l-8 25"/><path d="M94 8l-8 25"/></svg></div>',snow:'<div class="weather-mark snow-mark"><span>❄</span><span>❄</span></div>',wind:'<div class="weather-mark wind-mark"><svg viewBox="0 0 160 100"><path d="M4 22h112q32 0 25-16q-7-15-20-3"/><path d="M0 48h140q25 0 15 18q-8 12-19 0"/><path d="M18 76h75q28 0 23 16"/></svg></div>',fog:'<div class="weather-mark fog-mark"><svg viewBox="0 0 160 80"><path d="M5 12h125M30 32h125M0 52h125"/></svg></div>'};
 const cl=(dark,extra='')=>`<div class="cloud ${dark?'dark':''}" style="${extra}"><i></i><i></i><i></i><i></i></div>`;
 const orb=night?'<div class="moon"></div>':'<div class="rays"></div><div class="sun"></div>';
 const orbSmall=night?'<div class="moon" style="inset:8% 40% 48% 12%"></div>':'<div class="rays" style="inset:-5% 30% 35% -5%"></div><div class="sun" style="inset:8% 42% 50% 10%"></div>';
 const m={clear:orb,partly:orbSmall+cl(false,'top:38%'),cloudy:cl(false,'top:20%;opacity:.7;transform:scale(.7) translateX(25%)')+cl(false),
  fog:cl(false,'opacity:.8'),rain:cl(true),storm:cl(true)+'<div class="bolt"></div>',snow:cl(false),
  wind:cl(false,'opacity:.9;transform:scale(.8)')};
 $('icon').innerHTML=(m[k]||cl(false))+(marks[k]||'');
}
function hourly(w){
 const h=w.hourly,now=Date.now();let i=h.time.findIndex(t=>new Date(t).getTime()>=now-3600e3);if(i<0)i=0;
 const n=window.innerWidth<700?6:10, step=window.innerWidth<700?2:2;
 const idx=[...Array(n)].map((_,k)=>i+k*step).filter(j=>j<h.time.length);
 const temps=idx.map(j=>h.temperature_2m[j]),mn=Math.min(...temps),mx=Math.max(...temps);
 $('hours').innerHTML=idx.map(j=>{const [, ,k]=WMO[h.weather_code[j]]||[0,0,'cloudy'];const e=(!h.is_day[j]&&k==='clear')?EMO.night:EMO[k];
  return `<div class="h"><span class="t">${new Date(h.time[j]).toLocaleTimeString([], {hour:'numeric'})}</span><span class="e">${e}</span><b>${Math.round(h.temperature_2m[j])}°</b></div>`}).join('');
 const W=1000,H=100,pts=temps.map((t,k)=>[(k+.5)*W/temps.length,15+(1-(t-mn)/((mx-mn)||1))*35]);
 let dpath=`M0 ${pts[0][1]} `;pts.forEach((p,k)=>{const pr=pts[k-1]||[0,p[1]];const cx=(pr[0]+p[0])/2;dpath+=`C${cx} ${pr[1]} ${cx} ${p[1]} ${p[0]} ${p[1]} `});dpath+=`L${W} ${pts.at(-1)[1]}`;
 $('wave').setAttribute('viewBox',`0 0 ${W} ${H}`);
 $('wave').innerHTML=`<defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
 <path d="${dpath} L${W} ${H} L0 ${H}Z" fill="url(#g)"/><path class="path" d="${dpath}" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
}

/* ---------- particle effects ---------- */
const cv=$('fx'),ctx=cv.getContext('2d');let P=[],mode,isNight,wind=0,raf;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',size);size();
let clouds=[],lightningTimer;const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function scenery(kind){clouds=[];const n={cloudy:9,rain:7,storm:8,fog:12,partly:4,snow:5,wind:6}[kind]||0;
 for(let i=0;i<n;i++)clouds.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight*.85,r:innerWidth*(.07+Math.random()*.12),v:kind==='wind'?1.5:.15+Math.random()*.25});}
function startFX(kind,night,ws,heat){mode=kind;isNight=night;wind=Math.min(ws,60)/10;P=[];scenery(kind);cancelAnimationFrame(raf);clearTimeout(lightningTimer);
 const W=innerWidth,H=innerHeight,area=W*H/1e6;
 const make={rain:()=>({x:Math.random()*W*1.3,y:Math.random()*H,l:10+Math.random()*18,v:12+Math.random()*10}),
  snow:()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*3.5,v:.5+Math.random()*1.3,a:Math.random()*6}),
  star:()=>({x:Math.random()*W,y:Math.random()*H*.75,r:Math.random()*1.4,a:Math.random()*6,tw:.01+Math.random()*.03}),
  wind:()=>({x:Math.random()*W,y:Math.random()*H,l:60+Math.random()*160,v:8+Math.random()*10,o:Math.random()*.4}),
  mote:()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2,v:.2+Math.random()*.5,a:Math.random()*6})};
 const add=(t,n)=>{for(let i=0;i<n;i++)P.push({t,...make[t]()})};
 if(kind==='rain')add('rain',500*area);if(kind==='storm')add('rain',800*area);
 if(kind==='snow')add('snow',300*area);if(kind==='wind'||ws>=30)add('wind',60*area);
 if(night)add('star',220*area);if(kind==='clear'&&!night||kind==='partly'&&!night)add('mote',(['hot','extreme'].includes(heat)?140:60)*area);
 if(kind==='storm'&&!reduced.matches)lightning();
 loop();}
function lightning(){lightningTimer=setTimeout(()=>{if(mode!=='storm')return;const f=$('flash');
 f.animate([{opacity:0},{opacity:.18},{opacity:.04},{opacity:.12},{opacity:0}],{duration:600});lightning()},3000+Math.random()*6000)}
function loop(){const W=innerWidth,H=innerHeight;ctx.clearRect(0,0,W,H);
 for(const cloud of clouds){
  const fog=mode==='fog',dark=mode==='storm';
  ctx.save();ctx.globalAlpha=fog?.10:.14;
  for(let j=0;j<5;j++){const x=cloud.x+(j-2)*cloud.r*.45,y=cloud.y+Math.sin(j*1.8)*cloud.r*.16;
   const g=ctx.createRadialGradient(x,y,0,x,y,cloud.r);g.addColorStop(0,dark?'rgba(8,12,25,.95)':'rgba(245,250,255,.8)');g.addColorStop(1,'rgba(245,250,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,cloud.r,cloud.r*(fog?.25:.5),0,0,7);ctx.fill();}
  ctx.restore();if(!reduced.matches){cloud.x+=cloud.v;if(cloud.x>W+cloud.r*2)cloud.x=-cloud.r*2;}
 }

 for(const p of P){
  if(p.t==='rain'){ctx.strokeStyle='rgba(200,225,255,.45)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-wind*1.5-2,p.y+p.l);ctx.stroke();
   p.y+=p.v;p.x-=wind*.8+1;if(p.y>H){p.y=-20;p.x=Math.random()*W*1.3;
   if(Math.random()<.3){ctx.strokeStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.ellipse(p.x,H-4,6,2,0,0,7);ctx.stroke()}}}
  else if(p.t==='snow'){p.a+=.02;p.y+=p.v;p.x+=Math.sin(p.a)*.6+wind*.15;ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
   if(p.y>H){p.y=-5;p.x=Math.random()*W}if(p.x>W)p.x=0}
  else if(p.t==='star'){p.a+=p.tw;ctx.fillStyle=`rgba(255,255,255,${.3+Math.abs(Math.sin(p.a))*.7})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
  else if(p.t==='wind'){const g=ctx.createLinearGradient(p.x,0,p.x+p.l,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,`rgba(255,255,255,${p.o})`);g.addColorStop(1,'rgba(255,255,255,0)');
   ctx.strokeStyle=g;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(p.x+p.l/2,p.y-8*Math.sin(p.x/80),p.x+p.l,p.y);ctx.stroke();
   p.x+=p.v;if(p.x>W){p.x=-p.l;p.y=Math.random()*H}}
  else if(p.t==='mote'){p.a+=.01;p.y-=p.v;p.x+=Math.sin(p.a)*.3;ctx.fillStyle=`rgba(255,240,200,${.25+Math.sin(p.a)*.2})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();if(p.y<0){p.y=H;p.x=Math.random()*W}}
 }
 if(!reduced.matches)raf=requestAnimationFrame(loop);}

function fail(e){console.error(e);const l=$('ltxt');l.innerHTML='COULD NOT LOAD WEATHER<br><small style="opacity:.6;letter-spacing:.05em">'+(e&&e.message||e)+'<br>Tip: download the file and open it in Chrome / Edge / Safari.</small><br><button id="rt" style="margin-top:16px;padding:10px 22px;border-radius:99px;border:1px solid #fff5;background:#fff2;color:#fff;font:inherit;cursor:pointer">TRY AGAIN</button>';$('rt').onclick=()=>{l.textContent='READING THE SKY…';load().catch(fail)}}
load().catch(fail);
setInterval(()=>load().catch(()=>{}),10*60*1000);
</script>
</body>
</html>
